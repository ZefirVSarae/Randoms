<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Фруктовый ниндзя</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 16px 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
        }
        h2 { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
        .info {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 8px;
            padding: 0 4px;
        }
        .info span {
            background: #f5f5f5;
            padding: 4px 12px;
            border-radius: 12px;
            border: 2px solid #ddd;
        }
        canvas {
            border: 3px solid #111;
            border-radius: 16px;
            background: linear-gradient(180deg, #87CEEB, #E0F0FF);
            display: block;
            margin: 0 auto;
            width: 100%;
            aspect-ratio: 300/400;
            touch-action: none;
            cursor: crosshair;
        }
        .status {
            font-weight: 700;
            min-height: 28px;
            margin: 8px 0 4px;
            font-size: 16px;
        }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 10px 28px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            margin-top: 4px;
            touch-action: manipulation;
            min-height: 48px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        .hint {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 4px;
        }
        @media (max-width: 480px) {
            .game { padding: 12px 14px; }
            .info { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>🍉 Фруктовый ниндзя</h2>
        <div class="info">
            <span>🍎 <span id="score">0</span></span>
            <span>❤️ <span id="lives">3</span></span>
        </div>
        <canvas id="canvas" width="300" height="400"></canvas>
        <div class="status" id="status">Проводи пальцем по экрану!</div>
        <div class="hint">✂️ Проводи по фруктам, чтобы разрезать их</div>
        <button class="reset-btn" id="resetBtn">🔄 Новая игра</button>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const statusEl = document.getElementById('status');

        const W = 300, H = 400;
        let fruits = [];
        let bombs = [];
        let score = 0, lives = 3;
        let gameOver = false;
        let gameLoop = null;
        let lastSpawn = 0;
        const SPAWN_INTERVAL = 800;
        let particles = [];

        const fruitEmojis = ['🍎', '🍐', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓', '🍑', '🍒', '🫐', '🥝'];
        const bombEmoji = '💣';

        function initGame() {
            fruits = [];
            bombs = [];
            particles = [];
            score = 0;
            lives = 3;
            gameOver = false;
            scoreEl.textContent = '0';
            livesEl.textContent = '3';
            statusEl.textContent = 'Проводи пальцем по экрану!';
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 30);
            spawnFruit();
            spawnFruit();
            spawnFruit();
        }

        function spawnFruit() {
            if (gameOver) return;
            const isBomb = Math.random() < 0.2; // 20% бомба
            const x = Math.random() * (W - 40) + 20;
            const vy = -(Math.random() * 6 + 4);
            const vx = (Math.random() - 0.5) * 4;
            const emoji = isBomb ? bombEmoji : fruitEmojis[Math.floor(Math.random() * fruitEmojis.length)];
            
            const obj = {
                x, y: H,
                vx, vy,
                w: 32,
                h: 32,
                emoji,
                isBomb,
                sliced: false,
                rotation: 0
            };
            if (isBomb) bombs.push(obj);
            else fruits.push(obj);
        }

        function update() {
            if (gameOver) return;

            // спавн
            const now = Date.now();
            if (now - lastSpawn > SPAWN_INTERVAL) {
                spawnFruit();
                lastSpawn = now;
                if (Math.random() < 0.3) spawnFruit();
            }

            // обновление фруктов
            for (let i = fruits.length - 1; i >= 0; i--) {
                const f = fruits[i];
                f.x += f.vx;
                f.y += f.vy;
                f.vy += 0.15; // гравитация
                f.rotation += f.vx * 0.02;
                if (f.y > H + 50 || f.x < -50 || f.x > W + 50) {
                    fruits.splice(i, 1);
                }
            }

            // обновление бомб
            for (let i = bombs.length - 1; i >= 0; i--) {
                const b = bombs[i];
                b.x += b.vx;
                b.y += b.vy;
                b.vy += 0.15;
                b.rotation += b.vx * 0.02;
                if (b.y > H + 50 || b.x < -50 || b.x > W + 50) {
                    bombs.splice(i, 1);
                }
            }

            // обновление частиц
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            
            // фрукты
            for (let f of fruits) {
                if (f.sliced) continue;
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate(f.rotation || 0);
                ctx.font = '32px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(f.emoji, 0, 0);
                ctx.restore();
            }

            // бомбы
            for (let b of bombs) {
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.rotation || 0);
                ctx.font = '32px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.emoji, 0, 0);
                ctx.restore();
            }

            // частицы
            for (let p of particles) {
                ctx.globalAlpha = p.life / 20;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 6, 6);
            }
            ctx.globalAlpha = 1;
        }

        function slice(x, y) {
            if (gameOver) return;
            
            // проверяем попадание по фруктам
            for (let i = fruits.length - 1; i >= 0; i--) {
                const f = fruits[i];
                if (f.sliced) continue;
                const dist = Math.hypot(f.x - x, f.y - y);
                if (dist < 30) {
                    f.sliced = true;
                    score += 10;
                    scoreEl.textContent = score;
                    // частицы
                    for (let j = 0; j < 10; j++) {
                        particles.push({
                            x: f.x,
                            y: f.y,
                            vx: (Math.random() - 0.5) * 6,
                            vy: (Math.random() - 0.5) * 6 - 2,
                            color: ['#ef4444', '#eab308', '#22c55e', '#f97316'][Math.floor(Math.random() * 4)],
                            life: 20
                        });
                    }
                    fruits.splice(i, 1);
                    // создаём новые
                    if (Math.random() < 0.4) spawnFruit();
                }
            }

            // проверяем попадание по бомбам
            for (let i = bombs.length - 1; i >= 0; i--) {
                const b = bombs[i];
                const dist = Math.hypot(b.x - x, b.y - y);
                if (dist < 30) {
                    lives--;
                    livesEl.textContent = lives;
                    // взрыв
                    for (let j = 0; j < 20; j++) {
                        particles.push({
                            x: b.x,
                            y: b.y,
                            vx: (Math.random() - 0.5) * 8,
                            vy: (Math.random() - 0.5) * 8 - 3,
                            color: '#ef4444',
                            life: 30
                        });
                    }
                    bombs.splice(i, 1);
                    if (lives <= 0) {
                        gameOver = true;
                        statusEl.textContent = '💀 Игра окончена!';
                    }
                }
            }
        }

        // Мышь
        canvas.addEventListener('mousemove', (e) => {
            if (e.buttons === 1) {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width * W;
                const y = (e.clientY - rect.top) / rect.height * H;
                slice(x, y);
            }
        });

        // Тач
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            for (let touch of e.touches) {
                const x = (touch.clientX - rect.left) / rect.width * W;
                const y = (touch.clientY - rect.top) / rect.height * H;
                slice(x, y);
            }
        }, { passive: false });

        resetBtn.addEventListener('click', initGame);
        initGame();
    </script>
</body>
</html>
