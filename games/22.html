<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Парковка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 16px 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
        }
        h2 { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
        canvas {
            border: 3px solid #111;
            border-radius: 16px;
            background: #2d2d2d;
            display: block;
            margin: 0 auto;
            width: 100%;
            aspect-ratio: 400/400;
            touch-action: none;
        }
        .status {
            font-weight: 700;
            min-height: 28px;
            margin: 8px 0 4px;
            font-size: 16px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 200px;
            margin: 8px auto;
        }
        .ctrl-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 24px;
            padding: 8px;
            border: 3px solid #111;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            box-shadow: 3px 3px 0 0 #ccc;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 50px;
        }
        .ctrl-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 0 #ccc;
        }
        .ctrl-btn.empty { visibility: hidden; }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 10px 28px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            margin-top: 4px;
            touch-action: manipulation;
            min-height: 48px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        .hint {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 4px;
        }
        @media (max-width: 480px) {
            .game { padding: 12px 14px; }
            .ctrl-btn { font-size: 20px; min-height: 44px; }
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>🚗 Парковка</h2>
        <canvas id="canvas" width="400" height="400"></canvas>
        <div class="status" id="status">Запаркуй машину!</div>
        <div class="hint">👆 Используй кнопки или стрелки</div>
        <div class="controls">
            <div class="ctrl-btn empty"></div>
            <button class="ctrl-btn" id="upBtn">▲</button>
            <div class="ctrl-btn empty"></div>
            <button class="ctrl-btn" id="leftBtn">◀</button>
            <button class="ctrl-btn" id="downBtn">▼</button>
            <button class="ctrl-btn" id="rightBtn">▶</button>
        </div>
        <button class="reset-btn" id="resetBtn">🔄 Новый уровень</button>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');

        const SIZE = 400;
        const CAR_SIZE = 40;
        let car = { x: 180, y: 360, angle: 0 };
        let parking = { x: 180, y: 40 };
        let obstacles = [];
        let level = 1;
        let gameOver = false;
        let gameLoop = null;

        function generateLevel() {
            car = { x: 180, y: 360, angle: 0 };
            parking = { 
                x: Math.random() * (SIZE - CAR_SIZE * 2) + CAR_SIZE,
                y: Math.random() * (SIZE - CAR_SIZE * 2) + CAR_SIZE
            };
            obstacles = [];
            const numObstacles = 3 + level;
            for (let i = 0; i < numObstacles; i++) {
                let x, y, w, h;
                let attempts = 0;
                do {
                    x = Math.random() * (SIZE - 60) + 30;
                    y = Math.random() * (SIZE - 60) + 30;
                    w = Math.random() * 40 + 20;
                    h = Math.random() * 40 + 20;
                    attempts++;
                } while (attempts < 50 && (
                    Math.hypot(x - car.x, y - car.y) < 80 ||
                    Math.hypot(x - parking.x, y - parking.y) < 80
                ));
                obstacles.push({ x, y, w, h });
            }
            gameOver = false;
            statusEl.textContent = `Уровень ${level}`;
        }

        function draw() {
            ctx.clearRect(0, 0, SIZE, SIZE);
            
            // дорога
            ctx.fillStyle = '#3d3d3d';
            ctx.fillRect(0, 0, SIZE, SIZE);
            
            // разметка
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            for (let i = 0; i < SIZE; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, SIZE);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(SIZE, i);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // препятствия
            ctx.fillStyle = '#8B0000';
            for (let o of obstacles) {
                ctx.fillRect(o.x, o.y, o.w, o.h);
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 2;
                ctx.strokeRect(o.x, o.y, o.w, o.h);
            }

            // парковка
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(parking.x, parking.y, CAR_SIZE, CAR_SIZE);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('P', parking.x + CAR_SIZE/2, parking.y + CAR_SIZE/2);

            // машина
            ctx.save();
            ctx.translate(car.x + CAR_SIZE/2, car.y + CAR_SIZE/2);
            ctx.rotate(car.angle);
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(-CAR_SIZE/2, -CAR_SIZE/2, CAR_SIZE, CAR_SIZE);
            ctx.fillStyle = '#60a5fa';
            ctx.fillRect(-CAR_SIZE/2 + 4, -CAR_SIZE/2 - 2, 8, 6);
            ctx.fillRect(CAR_SIZE/2 - 12, -CAR_SIZE/2 - 2, 8, 6);
            ctx.fillRect(-CAR_SIZE/2 + 4, CAR_SIZE/2 - 4, 8, 6);
            ctx.fillRect(CAR_SIZE/2 - 12, CAR_SIZE/2 - 4, 8, 6);
            ctx.restore();
        }

        function checkCollision() {
            const cx = car.x + CAR_SIZE/2;
            const cy = car.y + CAR_SIZE/2;
            const radius = CAR_SIZE/2;
            
            // препятствия
            for (let o of obstacles) {
                const closestX = Math.max(o.x, Math.min(cx, o.x + o.w));
                const closestY = Math.max(o.y, Math.min(cy, o.y + o.h));
                const dist = Math.hypot(cx - closestX, cy - closestY);
                if (dist < radius) return true;
            }
            
            // стены
            if (car.x < 0 || car.x + CAR_SIZE > SIZE || 
                car.y < 0 || car.y + CAR_SIZE > SIZE) return true;
            
            return false;
        }

        function checkWin() {
            const cx = car.x + CAR_SIZE/2;
            const cy = car.y + CAR_SIZE/2;
            const px = parking.x + CAR_SIZE/2;
            const py = parking.y + CAR_SIZE/2;
            const dist = Math.hypot(cx - px, cy - py);
            return dist < CAR_SIZE;
        }

        function moveCar(dx, dy) {
            if (gameOver) return;
            const oldX = car.x, oldY = car.y;
            car.x += dx;
            car.y += dy;
            
            if (checkCollision()) {
                car.x = oldX;
                car.y = oldY;
                return;
            }
            
            draw();
            
            if (checkWin()) {
                gameOver = true;
                level++;
                statusEl.textContent = `🎉 Уровень ${level-1} пройден!`;
                setTimeout(() => {
                    generateLevel();
                    draw();
                    statusEl.textContent = `Уровень ${level}`;
                }, 1500);
            }
        }

        function rotateCar(angle) {
            if (gameOver) return;
            car.angle += angle;
            draw();
        }

        // Управление
        document.getElementById('upBtn').addEventListener('click', () => moveCar(0, -4));
        document.getElementById('downBtn').addEventListener('click', () => moveCar(0, 4));
        document.getElementById('leftBtn').addEventListener('click', () => moveCar(-4, 0));
        document.getElementById('rightBtn').addEventListener('click', () => moveCar(4, 0));

        // Клавиатура
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') { e.preventDefault(); moveCar(0, -4); }
            if (e.key === 'ArrowDown') { e.preventDefault(); moveCar(0, 4); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); moveCar(-4, 0); }
            if (e.key === 'ArrowRight') { e.preventDefault(); moveCar(4, 0); }
            if (e.key === 'r' || e.key === 'R') { generateLevel(); draw(); }
        });

        // Свайпы
        let startX = 0, startY = 0;
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (startX === 0) return;
            const touch = e.touches[0];
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;
            if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    moveCar(dx > 0 ? 4 : -4, 0);
                } else {
                    moveCar(0, dy > 0 ? 4 : -4);
                }
                startX = touch.clientX;
                startY = touch.clientY;
            }
        }, { passive: false });

        resetBtn.addEventListener('click', () => {
            level = 1;
            generateLevel();
            draw();
        });

        generateLevel();
        draw();
    </script>
</body>
</html>
