<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Пинг-понг</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 16px 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
        }
        h2 { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
        .info {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 8px;
            padding: 0 4px;
        }
        .info span {
            background: #f5f5f5;
            padding: 4px 16px;
            border-radius: 12px;
            border: 2px solid #ddd;
        }
        canvas {
            border: 3px solid #111;
            border-radius: 16px;
            background: #0a0a2e;
            display: block;
            margin: 0 auto;
            width: 100%;
            aspect-ratio: 400/300;
            touch-action: none;
        }
        .status {
            font-weight: 700;
            min-height: 28px;
            margin: 8px 0 4px;
            font-size: 16px;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 6px 0;
        }
        .ctrl-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 18px;
            padding: 8px 20px;
            border: 3px solid #111;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            box-shadow: 3px 3px 0 0 #ccc;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 44px;
            min-width: 60px;
        }
        .ctrl-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 0 #ccc;
        }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 10px 28px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            margin-top: 4px;
            touch-action: manipulation;
            min-height: 48px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        .mobile-hint {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 4px;
        }
        @media (max-width: 480px) {
            .game { padding: 12px 14px; }
            .info { font-size: 16px; }
            .info span { padding: 3px 12px; }
            .ctrl-btn { font-size: 14px; padding: 6px 14px; min-height: 40px; min-width: 50px; }
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>🏓 Пинг-понг</h2>
        <div class="info">
            <span>👤 <span id="playerScore">0</span></span>
            <span>🤖 <span id="aiScore">0</span></span>
        </div>
        <canvas id="canvas" width="400" height="300"></canvas>
        <div class="status" id="status">Нажми для начала</div>
        <div class="mobile-hint">👆 Касайся левой/правой стороны для движения</div>
        <div class="controls">
            <button class="ctrl-btn" id="leftBtn">◀</button>
            <button class="ctrl-btn" id="rightBtn">▶</button>
        </div>
        <button class="reset-btn" id="resetBtn">🔄 Новая игра</button>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const playerScoreEl = document.getElementById('playerScore');
        const aiScoreEl = document.getElementById('aiScore');
        const statusEl = document.getElementById('status');

        const W = 400, H = 300;
        const PADDLE_W = 8, PADDLE_H = 60, BALL_SIZE = 8;
        let player = { x: 20, y: H/2 - PADDLE_H/2 };
        let ai = { x: W - 20 - PADDLE_W, y: H/2 - PADDLE_H/2 };
        let ball = { x: W/2, y: H/2, dx: 3, dy: 2 };
        let playerScore = 0, aiScore = 0;
        let gameActive = false;
        let gameLoop = null;
        let aiSpeed = 3;

        function initGame() {
            player.y = H/2 - PADDLE_H/2;
            ai.y = H/2 - PADDLE_H/2;
            ball.x = W/2;
            ball.y = H/2;
            ball.dx = 3 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = 2 * (Math.random() > 0.5 ? 1 : -1);
            playerScore = 0;
            aiScore = 0;
            playerScoreEl.textContent = '0';
            aiScoreEl.textContent = '0';
            gameActive = true;
            statusEl.textContent = 'Игра началась!';
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 16);
        }

        function update() {
            if (!gameActive) return;

            // движение мяча
            ball.x += ball.dx;
            ball.y += ball.dy;

            // стены
            if (ball.y <= 0 || ball.y + BALL_SIZE >= H) ball.dy *= -1;

            // AI движение
            const aiCenter = ai.y + PADDLE_H/2;
            if (ball.y < aiCenter - 10) ai.y -= aiSpeed;
            else if (ball.y > aiCenter + 10) ai.y += aiSpeed;
            ai.y = Math.max(0, Math.min(H - PADDLE_H, ai.y));

            // столкновение с ракетками
            // игрок
            if (ball.x <= player.x + PADDLE_W && 
                ball.x + BALL_SIZE >= player.x &&
                ball.y + BALL_SIZE >= player.y && 
                ball.y <= player.y + PADDLE_H) {
                ball.dx = Math.abs(ball.dx);
                // угол зависит от места удара
                const hitPos = (ball.y + BALL_SIZE/2 - (player.y + PADDLE_H/2)) / (PADDLE_H/2);
                ball.dy = hitPos * 3;
                ball.dx *= 1.05;
            }

            // AI
            if (ball.x + BALL_SIZE >= ai.x && 
                ball.x <= ai.x + PADDLE_W &&
                ball.y + BALL_SIZE >= ai.y && 
                ball.y <= ai.y + PADDLE_H) {
                ball.dx = -Math.abs(ball.dx);
                const hitPos = (ball.y + BALL_SIZE/2 - (ai.y + PADDLE_H/2)) / (PADDLE_H/2);
                ball.dy = hitPos * 3;
                ball.dx *= 1.05;
            }

            // гол
            if (ball.x < 0) {
                aiScore++;
                aiScoreEl.textContent = aiScore;
                resetBall();
            } else if (ball.x + BALL_SIZE > W) {
                playerScore++;
                playerScoreEl.textContent = playerScore;
                resetBall();
            }

            // победа
            if (playerScore >= 5) {
                statusEl.textContent = '🎉 Ты победил!';
                gameActive = false;
            } else if (aiScore >= 5) {
                statusEl.textContent = '😵 ИИ победил!';
                gameActive = false;
            }

            draw();
        }

        function resetBall() {
            ball.x = W/2;
            ball.y = H/2 + (Math.random() - 0.5) * 60;
            ball.dx = 3 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = 2 * (Math.random() > 0.5 ? 1 : -1);
            // сброс скоростей
            ball.dx = Math.sign(ball.dx) * 3;
            ball.dy = Math.sign(ball.dy) * 2;
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            // центр
            ctx.strokeStyle = '#444';
            ctx.setLineDash([5, 10]);
            ctx.beginPath();
            ctx.moveTo(W/2, 0);
            ctx.lineTo(W/2, H);
            ctx.stroke();
            ctx.setLineDash([]);

            // ракетки
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(player.x, player.y, PADDLE_W, PADDLE_H);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(ai.x, ai.y, PADDLE_W, PADDLE_H);

            // мяч
            ctx.fillStyle = 'white';
            ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
        }

        // управление
        let moveUp = false, moveDown = false;
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') moveUp = true;
            if (e.key === 'ArrowDown') moveDown = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') moveUp = false;
            if (e.key === 'ArrowDown') moveDown = false;
        });

        // обновление позиции игрока (вне цикла)
        setInterval(() => {
            if (!gameActive) return;
            if (moveUp) player.y = Math.max(0, player.y - 4);
            if (moveDown) player.y = Math.min(H - PADDLE_H, player.y + 4);
        }, 16);

        // кнопки
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveUp = true; });
        document.getElementById('leftBtn').addEventListener('touchend', (e) => { e.preventDefault(); moveUp = false; });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveDown = true; });
        document.getElementById('rightBtn').addEventListener('touchend', (e) => { e.preventDefault(); moveDown = false; });

        // Тач на канвасе
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const canvasY = (touch.clientY - rect.top) / rect.height * H;
            if (canvasY < H/2) moveUp = true;
            else moveDown = true;
        });
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            moveUp = false;
            moveDown = false;
        });
        canvas.addEventListener('touchcancel', (e) => {
            moveUp = false;
            moveDown = false;
        });

        resetBtn.addEventListener('click', initGame);
        initGame();
    </script>
</body>
</html>
