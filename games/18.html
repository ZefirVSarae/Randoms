<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Рисовалка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 16px 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
        }
        h2 { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 1px;
            max-width: 320px;
            margin: 8px auto;
            border: 2px solid #111;
            border-radius: 8px;
            overflow: hidden;
        }
        .pixel {
            aspect-ratio: 1/1;
            background: white;
            cursor: pointer;
            transition: 0.05s;
            touch-action: manipulation;
            min-height: 16px;
        }
        .pixel:active { transform: scale(0.9); }
        .pixel.drawing { transform: scale(0.95); }
        .colors {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 8px 0;
        }
        .color-btn {
            width: 36px;
            height: 36px;
            border: 3px solid #111;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.1s;
            touch-action: manipulation;
        }
        .color-btn:active { transform: scale(0.85); }
        .color-btn.selected {
            border-color: #facc15;
            transform: scale(1.1);
            box-shadow: 0 0 0 3px #111;
        }
        .tools {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 6px 0;
        }
        .tool-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 14px;
            padding: 6px 16px;
            border: 3px solid #111;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            box-shadow: 3px 3px 0 0 #ccc;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 40px;
        }
        .tool-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 0 #ccc;
        }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 8px 24px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            margin-top: 4px;
            touch-action: manipulation;
            min-height: 44px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        .status {
            font-weight: 700;
            font-size: 14px;
            color: #555;
            margin: 4px 0;
        }
        @media (max-width: 480px) {
            .game { padding: 12px 14px; }
            .pixel { min-height: 14px; }
            .color-btn { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>🎨 Рисовалка</h2>
        <div class="grid" id="grid"></div>
        <div class="status" id="status">16×16 пикселей</div>
        <div class="colors" id="colors"></div>
        <div class="tools">
            <button class="tool-btn" id="clearBtn">🧹 Очистить</button>
            <button class="tool-btn" id="fillBtn">🪣 Заливка</button>
        </div>
        <button class="reset-btn" id="resetBtn">🔄 Новый холст</button>
    </div>
    <script>
        const SIZE = 16;
        let pixels = [];
        let currentColor = '#000000';
        let drawing = false;

        const colors = ['#000000', '#ef4444', '#3b82f6', '#22c55e', '#eab308', '#8b5cf6', '#ec4899', '#f97316', '#14b8a6', '#ffffff'];

        const gridEl = document.getElementById('grid');
        const colorsEl = document.getElementById('colors');
        const statusEl = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const clearBtn = document.getElementById('clearBtn');
        const fillBtn = document.getElementById('fillBtn');

        function initPixels() {
            pixels = Array(SIZE).fill().map(() => Array(SIZE).fill('#ffffff'));
            render();
        }

        function render() {
            gridEl.innerHTML = '';
            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    const pixel = document.createElement('div');
                    pixel.className = 'pixel';
                    pixel.style.background = pixels[y][x];
                    pixel.dataset.x = x;
                    pixel.dataset.y = y;
                    
                    pixel.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        drawing = true;
                        setPixel(x, y);
                    });
                    pixel.addEventListener('mouseover', (e) => {
                        if (drawing) setPixel(x, y);
                    });
                    pixel.addEventListener('mouseup', () => { drawing = false; });
                    pixel.addEventListener('mouseleave', () => { drawing = false; });
                    
                    // Тач-события
                    pixel.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        drawing = true;
                        setPixel(x, y);
                        pixel.classList.add('drawing');
                    });
                    pixel.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        const touch = e.touches[0];
                        const rect = gridEl.getBoundingClientRect();
                        const touchX = Math.floor((touch.clientX - rect.left) / rect.width * SIZE);
                        const touchY = Math.floor((touch.clientY - rect.top) / rect.height * SIZE);
                        if (touchX >= 0 && touchX < SIZE && touchY >= 0 && touchY < SIZE) {
                            setPixel(touchX, touchY);
                        }
                    });
                    pixel.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        drawing = false;
                        pixel.classList.remove('drawing');
                    });
                    
                    gridEl.appendChild(pixel);
                }
            }
            renderColors();
        }

        function setPixel(x, y) {
            pixels[y][x] = currentColor;
            const index = y * SIZE + x;
            const child = gridEl.children[index];
            if (child) child.style.background = currentColor;
        }

        function renderColors() {
            colorsEl.innerHTML = '';
            colors.forEach((color, idx) => {
                const btn = document.createElement('div');
                btn.className = 'color-btn' + (color === currentColor ? ' selected' : '');
                btn.style.background = color;
                if (color === '#ffffff') btn.style.border = '3px solid #999';
                btn.dataset.color = color;
                btn.addEventListener('click', () => {
                    currentColor = color;
                    renderColors();
                });
                colorsEl.appendChild(btn);
            });
        }

        function fillAll() {
            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    pixels[y][x] = currentColor;
                }
            }
            render();
        }

        function clearCanvas() {
            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    pixels[y][x] = '#ffffff';
                }
            }
            render();
        }

        resetBtn.addEventListener('click', initPixels);
        clearBtn.addEventListener('click', clearCanvas);
        fillBtn.addEventListener('click', fillAll);

        initPixels();
    </script>
</body>
</html>
