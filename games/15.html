<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Сапёр</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 16px 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
            margin: 10px;
        }
        h2 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 4px;
        }
        .info {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 8px;
            padding: 0 4px;
        }
        .info span {
            background: #f5f5f5;
            padding: 4px 12px;
            border-radius: 12px;
            border: 2px solid #ddd;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            max-width: 320px;
            margin: 0 auto;
            touch-action: manipulation;
        }
        .cell {
            aspect-ratio: 1/1;
            border: 2px solid #111;
            border-radius: 8px;
            background: #d1d5db;
            font-weight: 800;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 36px;
            min-width: 36px;
            -webkit-tap-highlight-color: transparent;
        }
        .cell:active:not(.revealed):not(.flagged) {
            transform: scale(0.92);
            background: #b0b8c4;
        }
        .cell.revealed {
            background: white;
            border-color: #bbb;
            transform: none;
        }
        .cell.revealed.mine {
            background: #ef4444;
            border-color: #dc2626;
        }
        .cell.flagged {
            background: #facc15;
            border-color: #ca8a04;
        }
        .cell.long-press {
            background: #fbbf24;
        }
        .status {
            font-weight: 700;
            min-height: 28px;
            margin: 8px 0 4px;
            font-size: 16px;
            color: #333;
        }
        .hint {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 10px 28px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            margin-top: 4px;
            touch-action: manipulation;
            min-height: 48px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        .mobile-controls {
            display: none;
            gap: 8px;
            justify-content: center;
            margin: 6px 0;
        }
        @media (max-width: 480px) {
            .game { padding: 12px 14px; }
            .cell { font-size: 14px; min-height: 32px; min-width: 32px; }
            .info { font-size: 14px; }
            .info span { padding: 3px 10px; }
            .hint { font-size: 11px; }
        }
        @media (pointer: coarse) {
            .mobile-controls { display: flex; }
            .hint { display: block; }
        }
        .mobile-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 14px;
            padding: 6px 16px;
            border: 2px solid #111;
            border-radius: 16px;
            background: #f5f5f5;
            cursor: pointer;
            box-shadow: 3px 3px 0 0 #ccc;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 40px;
        }
        .mobile-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 0 #ccc;
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>💣 Сапёр</h2>
        <div class="info">
            <span>💥 <span id="mines">10</span></span>
            <span>🚩 <span id="flags">0</span></span>
        </div>
        <div class="grid" id="grid"></div>
        <div class="status" id="status">Кликни по клетке</div>
        <div class="hint" id="hint">👆 Короткое нажатие — открыть, долгое (0.5с) — флаг</div>
        <div class="mobile-controls">
            <button class="mobile-btn" id="flagModeBtn">🚩 Флаг</button>
            <button class="mobile-btn" id="openModeBtn">👆 Открыть</button>
        </div>
        <button class="reset-btn" id="resetBtn">🔄 Новая игра</button>
    </div>
    <script>
        const ROWS = 8, COLS = 8, MINES = 10;
        let board = [];
        let revealed = [];
        let flagged = [];
        let gameOver = false;
        let firstClick = true;
        let flagCount = 0;
        let flagMode = false;
        let longPressTimer = null;
        let isLongPress = false;

        const gridEl = document.getElementById('grid');
        const minesEl = document.getElementById('mines');
        const flagsEl = document.getElementById('flags');
        const statusEl = document.getElementById('status');
        const hintEl = document.getElementById('hint');
        const resetBtn = document.getElementById('resetBtn');
        const flagModeBtn = document.getElementById('flagModeBtn');
        const openModeBtn = document.getElementById('openModeBtn');

        function initBoard() {
            board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            revealed = Array(ROWS).fill().map(() => Array(COLS).fill(false));
            flagged = Array(ROWS).fill().map(() => Array(COLS).fill(false));
            gameOver = false;
            firstClick = true;
            flagCount = 0;
            flagMode = false;
            updateStats();
            render();
            statusEl.textContent = 'Кликни по клетке';
            hintEl.textContent = '👆 Короткое нажатие — открыть, долгое (0.5с) — флаг';
            updateModeButtons();
        }

        function placeMines(excludeX, excludeY) {
            let placed = 0;
            while (placed < MINES) {
                const x = Math.floor(Math.random() * COLS);
                const y = Math.floor(Math.random() * ROWS);
                if (board[y][x] === -1) continue;
                if (x === excludeX && y === excludeY) continue;
                board[y][x] = -1;
                placed++;
            }
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x] === -1) continue;
                    let count = 0;
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            if (dx === 0 && dy === 0) continue;
                            const nx = x + dx, ny = y + dy;
                            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && board[ny][nx] === -1) count++;
                        }
                    }
                    board[y][x] = count;
                }
            }
        }

        function render() {
            gridEl.innerHTML = '';
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (revealed[y][x]) {
                        cell.classList.add('revealed');
                        const val = board[y][x];
                        if (val === -1) {
                            cell.textContent = '💣';
                            cell.classList.add('mine');
                        } else if (val > 0) {
                            cell.textContent = val;
                            // цвета для чисел
                            const colors = ['', '#3b82f6', '#22c55e', '#ef4444', '#8b5cf6', '#ec4899', '#f97316', '#14b8a6', '#111'];
                            cell.style.color = colors[val] || '#111';
                        }
                    } else if (flagged[y][x]) {
                        cell.classList.add('flagged');
                        cell.textContent = '🚩';
                    }
                    cell.dataset.x = x;
                    cell.dataset.y = y;

                    // Универсальная обработка нажатий (мышь + тач)
                    cell.addEventListener('click', (e) => {
                        e.preventDefault();
                        if (longPressTimer) {
                            clearTimeout(longPressTimer);
                            longPressTimer = null;
                        }
                        if (isLongPress) {
                            isLongPress = false;
                            return;
                        }
                        handleLeftClick(x, y);
                    });

                    // Долгое нажатие для флага (мобильные)
                    cell.addEventListener('touchstart', (e) => {
                        isLongPress = false;
                        longPressTimer = setTimeout(() => {
                            isLongPress = true;
                            handleRightClick(x, y);
                            // вибрация
                            if (navigator.vibrate) navigator.vibrate(30);
                            cell.classList.add('long-press');
                            setTimeout(() => cell.classList.remove('long-press'), 200);
                        }, 500);
                    }, { passive: true });

                    cell.addEventListener('touchend', (e) => {
                        if (longPressTimer) {
                            clearTimeout(longPressTimer);
                            longPressTimer = null;
                        }
                        if (isLongPress) {
                            isLongPress = false;
                            return;
                        }
                        // короткое нажатие
                        handleLeftClick(x, y);
                    }, { passive: true });

                    cell.addEventListener('touchmove', (e) => {
                        if (longPressTimer) {
                            clearTimeout(longPressTimer);
                            longPressTimer = null;
                        }
                        isLongPress = false;
                    }, { passive: true });

                    // Для правой кнопки мыши
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleRightClick(x, y);
                    });

                    gridEl.appendChild(cell);
                }
            }
            updateStats();
        }

        function updateStats() {
            minesEl.textContent = MINES - flagCount;
            flagsEl.textContent = flagCount;
        }

        function updateModeButtons() {
            flagModeBtn.style.background = flagMode ? '#facc15' : '#f5f5f5';
            openModeBtn.style.background = !flagMode ? '#facc15' : '#f5f5f5';
            hintEl.textContent = flagMode ? '🚩 Режим флага: нажми на клетку' : '👆 Режим открытия: нажми на клетку';
        }

        function handleLeftClick(x, y) {
            if (gameOver) return;
            if (flagged[y][x]) {
                if (flagMode) {
                    // в режиме флага можно снять флаг
                    flagged[y][x] = false;
                    flagCount--;
                    render();
                }
                return;
            }
            if (revealed[y][x]) return;
            if (flagMode) {
                // режим флага
                flagged[y][x] = !flagged[y][x];
                flagCount += flagged[y][x] ? 1 : -1;
                render();
                return;
            }

            if (firstClick) {
                placeMines(x, y);
                firstClick = false;
            }

            revealCell(x, y);
        }

        function handleRightClick(x, y) {
            if (gameOver) return;
            if (revealed[y][x]) return;
            flagged[y][x] = !flagged[y][x];
            flagCount += flagged[y][x] ? 1 : -1;
            render();
        }

        function revealCell(x, y) {
            if (revealed[y][x]) return;
            if (flagged[y][x]) return;
            revealed[y][x] = true;
            if (board[y][x] === -1) {
                gameOver = true;
                for (let yy = 0; yy < ROWS; yy++) {
                    for (let xx = 0; xx < COLS; xx++) {
                        if (board[yy][xx] === -1) revealed[yy][xx] = true;
                    }
                }
                render();
                statusEl.textContent = '💥 Вы взорвались!';
                hintEl.textContent = 'Нажми "Новая игра"';
                return;
            }

            if (board[y][x] === 0) {
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dx = -1; dx <= 1; dx++) {
                        if (dx === 0 && dy === 0) continue;
                        const nx = x + dx, ny = y + dy;
                        if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !revealed[ny][nx] && !flagged[ny][nx]) {
                            revealCell(nx, ny);
                        }
                    }
                }
            }
            render();
            checkWin();
        }

        function checkWin() {
            let allRevealed = true;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x] !== -1 && !revealed[y][x]) {
                        allRevealed = false;
                        break;
                    }
                }
                if (!allRevealed) break;
            }
            if (allRevealed) {
                gameOver = true;
                statusEl.textContent = '🎉 Вы выиграли!';
                hintEl.textContent = 'Поздравляем! 🎊';
                // отмечаем все мины флагами
                for (let y = 0; y < ROWS; y++) {
                    for (let x = 0; x < COLS; x++) {
                        if (board[y][x] === -1) {
                            flagged[y][x] = true;
                            flagCount++;
                        }
                    }
                }
                render();
            }
        }

        resetBtn.addEventListener('click', initBoard);

        flagModeBtn.addEventListener('click', () => {
            flagMode = true;
            updateModeButtons();
        });

        openModeBtn.addEventListener('click', () => {
            flagMode = false;
            updateModeButtons();
        });

        // Начальная загрузка
        initBoard();

        // Адаптация под мобильные: убираем долгое нажатие на кнопках
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.stopPropagation();
            }, { passive: true });
        });
    </script>
</body>
</html>
