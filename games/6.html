<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Память</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 20px 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
        }
        h2 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .info {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 12px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 12px 0;
        }
        .card {
            aspect-ratio: 1/1;
            border: 3px solid #111;
            border-radius: 16px;
            background: #facc15;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 4px 4px 0 0 #111;
            user-select: none;
        }
        .card.flipped {
            background: white;
        }
        .card.matched {
            background: #86efac;
            cursor: default;
            opacity: 0.7;
            box-shadow: 2px 2px 0 0 #555;
        }
        .card:active:not(.flipped):not(.matched) {
            transform: scale(0.95);
            box-shadow: 2px 2px 0 0 #111;
        }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 8px 24px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            margin-top: 4px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        .message {
            font-weight: 700;
            min-height: 28px;
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>🧠 Память</h2>
        <div class="info">
            <span>Пар: <span id="pairs">0</span>/8</span>
            <span>Ходы: <span id="moves">0</span></span>
        </div>
        <div class="grid" id="grid"></div>
        <div class="message" id="message"></div>
        <button class="reset-btn" id="resetBtn">🔄 Новая игра</button>
    </div>
    <script>
        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
        let cards = [];
        let flipped = [];
        let matched = 0;
        let moves = 0;
        let lock = false;
        let timer = null;

        const gridEl = document.getElementById('grid');
        const pairsEl = document.getElementById('pairs');
        const movesEl = document.getElementById('moves');
        const messageEl = document.getElementById('message');
        const resetBtn = document.getElementById('resetBtn');

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGame() {
            const deck = [...emojis, ...emojis];
            cards = shuffle(deck).map((emoji, idx) => ({ id: idx, emoji, flipped: false, matched: false }));
            flipped = [];
            matched = 0;
            moves = 0;
            lock = false;
            if (timer) clearTimeout(timer);
            messageEl.textContent = '';
            render();
        }

        function render() {
            gridEl.innerHTML = '';
            cards.forEach((card, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                if (card.flipped) div.classList.add('flipped');
                if (card.matched) div.classList.add('matched');
                div.textContent = (card.flipped || card.matched) ? card.emoji : '?';
                div.dataset.index = index;
                div.addEventListener('click', () => handleClick(index));
                gridEl.appendChild(div);
            });
            pairsEl.textContent = matched;
            movesEl.textContent = moves;
        }

        function handleClick(index) {
            const card = cards[index];
            if (lock) return;
            if (card.flipped || card.matched) return;
            if (flipped.length === 2) return;

            // переворачиваем
            card.flipped = true;
            flipped.push(index);
            render();

            if (flipped.length === 2) {
                lock = true;
                moves++;
                const [i1, i2] = flipped;
                const c1 = cards[i1];
                const c2 = cards[i2];
                if (c1.emoji === c2.emoji) {
                    // совпадение
                    c1.matched = true;
                    c2.matched = true;
                    matched++;
                    flipped = [];
                    lock = false;
                    render();
                    if (matched === 8) {
                        messageEl.textContent = '🎉 Победа! Все пары найдены!';
                    }
                } else {
                    // не совпали – перевернуть обратно через паузу
                    timer = setTimeout(() => {
                        c1.flipped = false;
                        c2.flipped = false;
                        flipped = [];
                        lock = false;
                        render();
                        timer = null;
                    }, 700);
                }
            }
        }

        resetBtn.addEventListener('click', initGame);
        initGame();
    </script>
</body>
</html>
