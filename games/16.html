<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Космические захватчики</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 16px 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
        }
        h2 { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
        .info {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 8px;
            padding: 0 4px;
        }
        .info span {
            background: #f5f5f5;
            padding: 4px 12px;
            border-radius: 12px;
            border: 2px solid #ddd;
        }
        canvas {
            border: 3px solid #111;
            border-radius: 16px;
            background: #0a0a2e;
            display: block;
            margin: 0 auto;
            width: 100%;
            aspect-ratio: 300/400;
            touch-action: none;
        }
        .status {
            font-weight: 700;
            min-height: 28px;
            margin: 8px 0 4px;
            font-size: 16px;
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 6px 0;
        }
        .ctrl-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 18px;
            padding: 8px 20px;
            border: 3px solid #111;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            box-shadow: 3px 3px 0 0 #ccc;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 44px;
            min-width: 60px;
        }
        .ctrl-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 0 #ccc;
        }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 10px 28px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            margin-top: 4px;
            touch-action: manipulation;
            min-height: 48px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        .mobile-hint {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 4px;
        }
        @media (max-width: 480px) {
            .game { padding: 12px 14px; }
            .info { font-size: 14px; }
            .info span { padding: 3px 10px; }
            .ctrl-btn { font-size: 14px; padding: 6px 14px; min-height: 40px; min-width: 50px; }
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>👾 Космические захватчики</h2>
        <div class="info">
            <span>🎯 <span id="score">0</span></span>
            <span>❤️ <span id="lives">3</span></span>
        </div>
        <canvas id="canvas" width="300" height="400"></canvas>
        <div class="status" id="status">Стреляй по врагам!</div>
        <div class="mobile-hint">👆 Касайся слева/справа от корабля для движения</div>
        <div class="controls">
            <button class="ctrl-btn" id="leftBtn">◀</button>
            <button class="ctrl-btn" id="fireBtn">🔥</button>
            <button class="ctrl-btn" id="rightBtn">▶</button>
        </div>
        <button class="reset-btn" id="resetBtn">🔄 Новая игра</button>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const statusEl = document.getElementById('status');

        const W = 300, H = 400;
        let ship = { x: 150, y: 370, w: 30, h: 20 };
        let bullets = [];
        let enemies = [];
        let score = 0, lives = 3;
        let gameOver = false;
        let gameLoop = null;
        let enemyDirection = 1;
        let enemySpeed = 0.5;
        let moveLeft = false, moveRight = false;
        let canShoot = true;
        const SHOOT_COOLDOWN = 300;

        function initGame() {
            ship.x = 150;
            bullets = [];
            enemies = [];
            score = 0;
            lives = 3;
            gameOver = false;
            enemyDirection = 1;
            enemySpeed = 0.5;
            scoreEl.textContent = '0';
            livesEl.textContent = '3';
            statusEl.textContent = 'Стреляй по врагам!';
            createEnemies();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 30);
        }

        function createEnemies() {
            enemies = [];
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 8; col++) {
                    enemies.push({
                        x: 30 + col * 30,
                        y: 30 + row * 30,
                        w: 20,
                        h: 20,
                        alive: true,
                        type: row % 2
                    });
                }
            }
        }

        function update() {
            if (gameOver) return;

            // движение врагов
            let edgeHit = false;
            for (let e of enemies) {
                if (!e.alive) continue;
                e.x += enemySpeed * enemyDirection;
                if (e.x <= 0 || e.x + e.w >= W) edgeHit = true;
            }
            if (edgeHit) {
                enemyDirection *= -1;
                for (let e of enemies) {
                    e.y += 5;
                }
            }

            // движение корабля
            if (moveLeft && ship.x > 0) ship.x -= 4;
            if (moveRight && ship.x + ship.w < W) ship.x += 4;

            // стрельба
            if (canShoot && moveLeft === false && moveRight === false) {
                // стрельба по тапу на корабль
            }

            // пули
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= 6;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                    continue;
                }
                // проверка попаданий
                let hit = false;
                for (let e of enemies) {
                    if (!e.alive) continue;
                    const bx = bullets[i].x, by = bullets[i].y;
                    if (bx > e.x && bx < e.x + e.w && by > e.y && by < e.y + e.h) {
                        e.alive = false;
                        hit = true;
                        score += 10;
                        scoreEl.textContent = score;
                        break;
                    }
                }
                if (hit) {
                    bullets.splice(i, 1);
                }
            }

            // проверка, все ли враги убиты
            if (enemies.every(e => !e.alive)) {
                statusEl.textContent = '🎉 Победа!';
                gameOver = true;
                return;
            }

            // враги достигают корабля
            for (let e of enemies) {
                if (!e.alive) continue;
                if (e.y + e.h > ship.y) {
                    lives--;
                    livesEl.textContent = lives;
                    if (lives <= 0) {
                        statusEl.textContent = '💀 Игра окончена!';
                        gameOver = true;
                        return;
                    }
                    // сброс врагов
                    createEnemies();
                    return;
                }
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            // корабль
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(ship.x, ship.y, ship.w, ship.h);
            ctx.fillStyle = '#86efac';
            ctx.fillRect(ship.x + 5, ship.y - 5, 20, 5);

            // враги
            for (let e of enemies) {
                if (!e.alive) continue;
                ctx.fillStyle = e.type === 0 ? '#ef4444' : '#eab308';
                ctx.fillRect(e.x, e.y, e.w, e.h);
            }

            // пули
            ctx.fillStyle = '#60a5fa';
            for (let b of bullets) {
                ctx.fillRect(b.x - 2, b.y - 5, 4, 10);
            }
        }

        function shoot() {
            if (gameOver) return;
            if (!canShoot) return;
            bullets.push({ x: ship.x + ship.w/2, y: ship.y });
            canShoot = false;
            setTimeout(() => { canShoot = true; }, SHOOT_COOLDOWN);
        }

        // Клавиатура
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft = true;
            if (e.key === 'ArrowRight') moveRight = true;
            if (e.key === ' ') { e.preventDefault(); shoot(); }
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') moveLeft = false;
            if (e.key === 'ArrowRight') moveRight = false;
        });

        // Управление с телефона
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
        document.getElementById('leftBtn').addEventListener('touchend', (e) => { e.preventDefault(); moveLeft = false; });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
        document.getElementById('rightBtn').addEventListener('touchend', (e) => { e.preventDefault(); moveRight = false; });
        document.getElementById('fireBtn').addEventListener('click', shoot);
        document.getElementById('fireBtn').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });

        // Тач на канвасе - стрельба и движение
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const canvasX = (touch.clientX - rect.left) / rect.width * W;
            const canvasY = (touch.clientY - rect.top) / rect.height * H;
            
            if (canvasY > ship.y - 30) {
                // стрельба
                shoot();
            } else {
                // движение
                if (canvasX < ship.x) moveLeft = true;
                else if (canvasX > ship.x + ship.w) moveRight = true;
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            moveLeft = false;
            moveRight = false;
        });

        canvas.addEventListener('touchcancel', (e) => {
            moveLeft = false;
            moveRight = false;
        });

        resetBtn.addEventListener('click', initGame);
        initGame();
    </script>
</body>
</html>
