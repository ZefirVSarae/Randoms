<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тир</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 20px 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
        }
        h2 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .target-area {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            background: #f0f0f0;
            border-radius: 24px;
            border: 3px solid #111;
            overflow: hidden;
            margin-bottom: 12px;
            cursor: crosshair;
        }
        .target {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, #ef4444 30%, #dc2626 70%);
            border: 2px solid #111;
            box-shadow: 0 0 0 4px white, 0 0 0 6px #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 12px;
            color: white;
            cursor: pointer;
            transition: none;
            animation: pulse 0.6s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        .target.hit {
            animation: hitAnim 0.3s forwards;
        }
        @keyframes hitAnim {
            0% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        .message {
            font-weight: 700;
            min-height: 28px;
        }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 8px 24px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            margin-top: 4px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>🎯 Тир</h2>
        <div class="stats">
            <span>🎯 <span id="score">0</span></span>
            <span>⏱️ <span id="timer">30</span>с</span>
        </div>
        <div class="target-area" id="area"></div>
        <div class="message" id="message"></div>
        <button class="reset-btn" id="resetBtn">🔄 Новая игра</button>
    </div>
    <script>
        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let timerId = null;
        let spawnInterval = null;

        const area = document.getElementById('area');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const messageEl = document.getElementById('message');
        const resetBtn = document.getElementById('resetBtn');

        function spawnTarget() {
            if (!gameActive) return;
            const areaRect = area.getBoundingClientRect();
            const size = 40;
            const maxX = area.clientWidth - size;
            const maxY = area.clientHeight - size;
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            const target = document.createElement('div');
            target.className = 'target';
            target.style.left = x + 'px';
            target.style.top = y + 'px';
            target.dataset.hit = 'false';
            target.addEventListener('click', (e) => {
                e.stopPropagation();
                if (target.dataset.hit === 'true') return;
                target.dataset.hit = 'true';
                target.classList.add('hit');
                score++;
                scoreEl.textContent = score;
                setTimeout(() => target.remove(), 300);
            });
            area.appendChild(target);

            // самоуничтожение через 2 секунды
            setTimeout(() => {
                if (target.parentNode && target.dataset.hit === 'false') {
                    target.remove();
                }
            }, 2000);
        }

        function startGame() {
            // очистка
            if (timerId) clearInterval(timerId);
            if (spawnInterval) clearInterval(spawnInterval);
            area.innerHTML = '';
            score = 0;
            timeLeft = 30;
            gameActive = true;
            scoreEl.textContent = '0';
            timerEl.textContent = '30';
            messageEl.textContent = 'Кликай по мишеням!';

            timerId = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    clearInterval(spawnInterval);
                    gameActive = false;
                    messageEl.textContent = `⏰ Время вышло! Счёт: ${score}`;
                    area.innerHTML = '';
                }
            }, 1000);

            spawnInterval = setInterval(spawnTarget, 700);
            // сразу несколько целей
            for (let i = 0; i < 3; i++) setTimeout(spawnTarget, i * 200);
        }

        resetBtn.addEventListener('click', startGame);
        startGame();
    </script>
</body>
</html>
