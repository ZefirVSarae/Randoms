<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Математика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
        }
        h2 { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
        .info {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .info span {
            background: #f5f5f5;
            padding: 4px 12px;
            border-radius: 12px;
            border: 2px solid #ddd;
        }
        .problem {
            font-size: 42px;
            font-weight: 900;
            margin: 20px 0;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 20px;
            border: 3px solid #111;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 0;
        }
        .ans-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 28px;
            padding: 16px;
            border: 3px solid #111;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 64px;
        }
        .ans-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        .ans-btn.correct { background: #86efac; }
        .ans-btn.wrong { background: #fca5a5; }
        .ans-btn:disabled { opacity: 0.4; transform: none; box-shadow: 2px 2px 0 0 #ddd; cursor: not-allowed; }
        .status {
            font-weight: 700;
            min-height: 28px;
            font-size: 16px;
        }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 10px 28px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            margin-top: 4px;
            touch-action: manipulation;
            min-height: 48px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        @media (max-width: 480px) {
            .game { padding: 16px; }
            .problem { font-size: 34px; padding: 16px; min-height: 70px; }
            .ans-btn { font-size: 22px; padding: 12px; min-height: 56px; }
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>🧮 Математика</h2>
        <div class="info">
            <span>✅ <span id="correct">0</span></span>
            <span>❌ <span id="wrong">0</span></span>
            <span>⏱️ <span id="timer">60</span>с</span>
        </div>
        <div class="problem" id="problem">3 + 4 = ?</div>
        <div class="answers" id="answers"></div>
        <div class="status" id="status">Решай быстрее!</div>
        <button class="reset-btn" id="resetBtn">🔄 Новая игра</button>
    </div>
    <script>
        const problemEl = document.getElementById('problem');
        const answersEl = document.getElementById('answers');
        const correctEl = document.getElementById('correct');
        const wrongEl = document.getElementById('wrong');
        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');

        let correct = 0, wrong = 0;
        let timeLeft = 60;
        let gameActive = false;
        let timerId = null;
        let currentAnswer = 0;

        function generateProblem() {
            const operations = ['+', '-', '×'];
            const op = operations[Math.floor(Math.random() * operations.length)];
            let a, b, answer;
            if (op === '+') {
                a = Math.floor(Math.random() * 20) + 1;
                b = Math.floor(Math.random() * 20) + 1;
                answer = a + b;
            } else if (op === '-') {
                a = Math.floor(Math.random() * 20) + 10;
                b = Math.floor(Math.random() * a) + 1;
                answer = a - b;
            } else { // ×
                a = Math.floor(Math.random() * 10) + 1;
                b = Math.floor(Math.random() * 10) + 1;
                answer = a * b;
            }
            return { text: `${a} ${op} ${b} = ?`, answer };
        }

        function startGame() {
            correct = 0;
            wrong = 0;
            timeLeft = 60;
            gameActive = true;
            correctEl.textContent = '0';
            wrongEl.textContent = '0';
            timerEl.textContent = '60';
            statusEl.textContent = 'Решай быстрее!';
            if (timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    gameActive = false;
                    statusEl.textContent = `⏰ Время вышло! Правильных: ${correct}`;
                    document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
                }
            }, 1000);
            newQuestion();
        }

        function newQuestion() {
            if (!gameActive) return;
            const problem = generateProblem();
            currentAnswer = problem.answer;
            problemEl.textContent = problem.text;
            
            // генерация вариантов
            let options = [problem.answer];
            while (options.length < 4) {
                const offset = Math.floor(Math.random() * 10) + 1;
                const variant = problem.answer + (Math.random() > 0.5 ? offset : -offset);
                if (variant > 0 && !options.includes(variant)) {
                    options.push(variant);
                }
            }
            // перемешиваем
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }

            answersEl.innerHTML = '';
            options.forEach(val => {
                const btn = document.createElement('button');
                btn.className = 'ans-btn';
                btn.textContent = val;
                btn.addEventListener('click', () => checkAnswer(val, btn));
                answersEl.appendChild(btn);
            });
        }

        function checkAnswer(val, btn) {
            if (!gameActive) return;
            if (btn.disabled) return;
            
            const isCorrect = (val === currentAnswer);
            if (isCorrect) {
                correct++;
                correctEl.textContent = correct;
                btn.classList.add('correct');
                statusEl.textContent = '✅ Правильно!';
            } else {
                wrong++;
                wrongEl.textContent = wrong;
                btn.classList.add('wrong');
                statusEl.textContent = `❌ Неправильно. Ответ: ${currentAnswer}`;
            }
            
            // блокируем все кнопки на секунду
            document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
            setTimeout(() => {
                document.querySelectorAll('.ans-btn').forEach(b => {
                    b.disabled = false;
                    b.classList.remove('correct', 'wrong');
                });
                if (gameActive) newQuestion();
            }, 500);
        }

        resetBtn.addEventListener('click', startGame);
        startGame();
    </script>
</body>
</html>
