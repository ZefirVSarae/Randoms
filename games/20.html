<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Лабиринт</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 16px 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
        }
        h2 { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
        .info {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 8px;
            padding: 0 4px;
        }
        .info span {
            background: #f5f5f5;
            padding: 4px 12px;
            border-radius: 12px;
            border: 2px solid #ddd;
        }
        canvas {
            border: 3px solid #111;
            border-radius: 16px;
            background: #f5f5f5;
            display: block;
            margin: 0 auto;
            width: 100%;
            aspect-ratio: 1/1;
            touch-action: none;
        }
        .status {
            font-weight: 700;
            min-height: 28px;
            margin: 8px 0 4px;
            font-size: 16px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 200px;
            margin: 8px auto;
        }
        .ctrl-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 24px;
            padding: 8px;
            border: 3px solid #111;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            box-shadow: 3px 3px 0 0 #ccc;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 50px;
        }
        .ctrl-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 0 #ccc;
        }
        .ctrl-btn.empty { visibility: hidden; }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 10px 28px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            margin-top: 4px;
            touch-action: manipulation;
            min-height: 48px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        .hint {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 4px;
        }
        @media (max-width: 480px) {
            .game { padding: 12px 14px; }
            .ctrl-btn { font-size: 20px; min-height: 44px; }
        }
        @media (orientation: landscape) and (max-height: 600px) {
            .game { max-width: 320px; }
            .ctrl-btn { min-height: 40px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>🌀 Лабиринт</h2>
        <div class="info">
            <span>⏱️ <span id="moves">0</span></span>
            <span>🏆 <span id="best">-</span></span>
        </div>
        <canvas id="canvas" width="400" height="400"></canvas>
        <div class="status" id="status">Найди выход!</div>
        <div class="hint">👆 Используй кнопки или наклоняй телефон</div>
        <div class="controls">
            <div class="ctrl-btn empty"></div>
            <button class="ctrl-btn" id="upBtn">▲</button>
            <div class="ctrl-btn empty"></div>
            <button class="ctrl-btn" id="leftBtn">◀</button>
            <button class="ctrl-btn" id="downBtn">▼</button>
            <button class="ctrl-btn" id="rightBtn">▶</button>
        </div>
        <button class="reset-btn" id="resetBtn">🔄 Новый лабиринт</button>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const movesEl = document.getElementById('moves');
        const bestEl = document.getElementById('best');
        const statusEl = document.getElementById('status');

        const SIZE = 10;
        const CELL_SIZE = 400 / SIZE;
        let maze = [];
        let player = {x: 0, y: 0};
        let exit = {x: SIZE-1, y: SIZE-1};
        let moves = 0;
        let bestScore = parseInt(localStorage.getItem('mazeBest')) || 0;
        let gameOver = false;

        if (bestScore > 0) bestEl.textContent = bestScore;

        function generateMaze() {
            // простой генератор лабиринта (стены)
            maze = Array(SIZE).fill().map(() => Array(SIZE).fill(1));
            // делаем проходы
            const stack = [];
            const startX = 0, startY = 0;
            maze[startY][startX] = 0;
            stack.push({x: startX, y: startY});

            while (stack.length > 0) {
                const current = stack[stack.length - 1];
                const neighbors = [];
                const dirs = [[0,-2],[0,2],[-2,0],[2,0]];
                for (let d of dirs) {
                    const nx = current.x + d[0];
                    const ny = current.y + d[1];
                    if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE && maze[ny][nx] === 1) {
                        neighbors.push({x: nx, y: ny, dx: d[0]/2, dy: d[1]/2});
                    }
                }
                if (neighbors.length > 0) {
                    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    maze[current.y + next.dy][current.x + next.dx] = 0;
                    maze[next.y][next.x] = 0;
                    stack.push({x: next.x, y: next.y});
                } else {
                    stack.pop();
                }
            }
            // гарантируем выход
            maze[exit.y][exit.x] = 0;
            // если выход заблокирован, открываем
            if (SIZE > 1) {
                maze[exit.y-1][exit.x] = 0;
            }
        }

        function initGame() {
            generateMaze();
            player = {x: 0, y: 0};
            moves = 0;
            gameOver = false;
            statusEl.textContent = 'Найди выход!';
            movesEl.textContent = '0';
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 400);
            // стены
            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    if (maze[y][x] === 1) {
                        ctx.fillStyle = '#333';
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    } else {
                        ctx.fillStyle = '#f5f5f5';
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }
            // выход
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(exit.x * CELL_SIZE + 4, exit.y * CELL_SIZE + 4, CELL_SIZE - 8, CELL_SIZE - 8);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🏁', exit.x * CELL_SIZE + CELL_SIZE/2, exit.y * CELL_SIZE + CELL_SIZE/2);

            // игрок
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.arc(player.x * CELL_SIZE + CELL_SIZE/2, player.y * CELL_SIZE + CELL_SIZE/2, CELL_SIZE/2 - 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('😊', player.x * CELL_SIZE + CELL_SIZE/2, player.y * CELL_SIZE + CELL_SIZE/2);
        }

        function movePlayer(dx, dy) {
            if (gameOver) return;
            const newX = player.x + dx;
            const newY = player.y + dy;
            if (newX < 0 || newX >= SIZE || newY < 0 || newY >= SIZE) return;
            if (maze[newY][newX] === 1) return;
            
            player.x = newX;
            player.y = newY;
            moves++;
            movesEl.textContent = moves;
            draw();

            if (player.x === exit.x && player.y === exit.y) {
                gameOver = true;
                statusEl.textContent = '🎉 Поздравляю! Ты нашёл выход!';
                if (bestScore === 0 || moves < bestScore) {
                    bestScore = moves;
                    localStorage.setItem('mazeBest', bestScore);
                    bestEl.textContent = bestScore;
                    statusEl.textContent += ' 🏆 Новый рекорд!';
                }
            }
        }

        // управление
        document.getElementById('upBtn').addEventListener('click', () => movePlayer(0, -1));
        document.getElementById('downBtn').addEventListener('click', () => movePlayer(0, 1));
        document.getElementById('leftBtn').addEventListener('click', () => movePlayer(-1, 0));
        document.getElementById('rightBtn').addEventListener('click', () => movePlayer(1, 0));

        // клавиатура
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') { e.preventDefault(); movePlayer(0, -1); }
            if (e.key === 'ArrowDown') { e.preventDefault(); movePlayer(0, 1); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); movePlayer(-1, 0); }
            if (e.key === 'ArrowRight') { e.preventDefault(); movePlayer(1, 0); }
        });

        // Акселерометр (наклон телефона)
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                const gamma = e.gamma; // -90..90
                const beta = e.beta;   // -180..180
                if (Math.abs(gamma) > 15 && Math.abs(gamma) < 80) {
                    if (gamma > 0) movePlayer(1, 0);
                    else movePlayer(-1, 0);
                }
                if (Math.abs(beta) > 15 && Math.abs(beta) < 80) {
                    if (beta > 0) movePlayer(0, 1);
                    else movePlayer(0, -1);
                }
            }, { passive: true });
        }

        // Свайпы на канвасе
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (touchStartX === 0) return;
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
                if (dx > 0) movePlayer(1, 0);
                else movePlayer(-1, 0);
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            } else if (Math.abs(dy) > 20) {
                if (dy > 0) movePlayer(0, 1);
                else movePlayer(0, -1);
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            }
        }, { passive: false });

        resetBtn.addEventListener('click', initGame);
        initGame();
    </script>
</body>
</html>
