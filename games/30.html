<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Цветовой тест</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 8px 8px 0 0 #111;
            text-align: center;
        }
        h2 { font-size: 28px; font-weight: 900; margin-bottom: 4px; }
        .word-display {
            font-size: 56px;
            font-weight: 900;
            padding: 24px 0;
            margin: 12px 0;
            border-radius: 24px;
            border: 3px solid #111;
            background: #f5f5f5;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .color-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 16px 0;
        }
        .color-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 22px;
            padding: 16px;
            border: 3px solid #111;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 64px;
        }
        .color-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        .color-btn:disabled { opacity: 0.4; transform: none; box-shadow: 2px 2px 0 0 #ddd; cursor: not-allowed; }
        .status {
            font-weight: 700;
            font-size: 20px;
            min-height: 40px;
            margin: 8px 0;
        }
        .score {
            font-weight: 700;
            font-size: 18px;
            margin: 4px 0;
        }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 10px 28px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 48px;
            margin-top: 8px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        @media (max-width: 480px) {
            .word-display { font-size: 40px; min-height: 90px; }
            .color-btn { font-size: 18px; padding: 12px; min-height: 54px; }
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>🎨 Цветовой тест</h2>
        <div class="word-display" id="wordDisplay">КРАСНЫЙ</div>
        <div class="color-buttons" id="colorButtons"></div>
        <div class="status" id="status">Нажми на цвет слова</div>
        <div class="score">✅ <span id="score">0</span>  |  ❌ <span id="mistakes">0</span></div>
        <button class="reset-btn" id="resetBtn">🔄 Новая игра</button>
    </div>
    <script>
        const colors = [
            { name: 'КРАСНЫЙ', hex: '#ef4444' },
            { name: 'СИНИЙ', hex: '#3b82f6' },
            { name: 'ЗЕЛЁНЫЙ', hex: '#22c55e' },
            { name: 'ЖЁЛТЫЙ', hex: '#eab308' }
        ];

        let currentWord = null;
        let currentColor = null;
        let score = 0, mistakes = 0;
        let isWaiting = false;

        const wordDisplay = document.getElementById('wordDisplay');
        const statusEl = document.getElementById('status');
        const scoreEl = document.getElementById('score');
        const mistakesEl = document.getElementById('mistakes');
        const resetBtn = document.getElementById('resetBtn');
        const container = document.getElementById('colorButtons');

        function newRound() {
            if (isWaiting) return;
            // Выбираем случайное слово и случайный цвет (может совпадать, а может нет)
            const wordIdx = Math.floor(Math.random() * colors.length);
            const colorIdx = Math.floor(Math.random() * colors.length);
            currentWord = colors[wordIdx];
            currentColor = colors[colorIdx];

            wordDisplay.textContent = currentWord.name;
            wordDisplay.style.color = currentColor.hex;
            wordDisplay.style.background = '#f5f5f5';

            // Создаём кнопки цветов (все 4 варианта)
            container.innerHTML = '';
            colors.forEach((c, idx) => {
                const btn = document.createElement('button');
                btn.className = 'color-btn';
                btn.textContent = c.name;
                btn.style.background = c.hex;
                btn.style.color = 'white';
                btn.style.textShadow = '1px 1px 2px rgba(0,0,0,0.5)';
                btn.dataset.idx = idx;
                btn.addEventListener('click', () => checkAnswer(idx));
                container.appendChild(btn);
            });

            statusEl.textContent = 'Какой цвет слова?';
        }

        function checkAnswer(idx) {
            if (isWaiting) return;
            const selected = colors[idx];
            // Правильный ответ – цвет текста, а не значение слова
            const correct = (selected.hex === currentColor.hex);
            if (correct) {
                score++;
                statusEl.textContent = '✅ Правильно!';
                wordDisplay.style.background = '#86efac';
            } else {
                mistakes++;
                statusEl.textContent = `❌ Неправильно! Правильно: ${currentColor.name}`;
                wordDisplay.style.background = '#fca5a5';
            }
            scoreEl.textContent = score;
            mistakesEl.textContent = mistakes;

            isWaiting = true;
            document.querySelectorAll('.color-btn').forEach(b => b.disabled = true);
            setTimeout(() => {
                isWaiting = false;
                document.querySelectorAll('.color-btn').forEach(b => b.disabled = false);
                newRound();
            }, 1200);
        }

        resetBtn.addEventListener('click', () => {
            score = 0;
            mistakes = 0;
            scoreEl.textContent = '0';
            mistakesEl.textContent = '0';
            isWaiting = false;
            document.querySelectorAll('.color-btn').forEach(b => b.disabled = false);
            newRound();
        });

        newRound();
    </script>
</body>
</html>
