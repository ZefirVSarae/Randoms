<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Монетка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 8px 8px 0 0 #111;
            text-align: center;
        }
        h2 { font-size: 28px; font-weight: 900; margin-bottom: 4px; }
        .coin {
            font-size: 120px;
            line-height: 1.2;
            margin: 20px 0;
            transition: transform 0.2s;
            display: inline-block;
        }
        .coin.flip {
            animation: flip 0.6s ease-in-out;
        }
        @keyframes flip {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.2); }
            100% { transform: rotateY(360deg) scale(1); }
        }
        .result {
            font-size: 24px;
            font-weight: 800;
            min-height: 50px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            font-weight: 700;
            font-size: 18px;
            margin: 12px 0;
        }
        .stats span {
            background: #f5f5f5;
            padding: 4px 16px;
            border-radius: 16px;
            border: 2px solid #ddd;
        }
        .btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 20px;
            padding: 12px 36px;
            border: 3px solid #111;
            border-radius: 40px;
            background: #111;
            color: white;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #555;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 56px;
        }
        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #555;
        }
        .btn:disabled {
            opacity: 0.4;
            transform: none;
            box-shadow: 2px 2px 0 0 #888;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: white;
            color: #111;
            box-shadow: 4px 4px 0 0 #ccc;
            margin-top: 12px;
            font-size: 16px;
            padding: 10px 28px;
        }
        .btn-secondary:active { box-shadow: 2px 2px 0 0 #ccc; }
        @media (max-width: 480px) {
            .coin { font-size: 80px; }
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>🪙 Монетка</h2>
        <div class="coin" id="coin">🪙</div>
        <div class="result" id="result">Нажми "Бросить"</div>
        <button class="btn" id="flipBtn">Бросить</button>
        <div class="stats">
            <span>🦅 Орёл: <span id="heads">0</span></span>
            <span>🦅 Решка: <span id="tails">0</span></span>
        </div>
        <button class="btn btn-secondary" id="resetBtn">🔄 Сбросить счёт</button>
    </div>
    <script>
        const coinEl = document.getElementById('coin');
        const resultEl = document.getElementById('result');
        const flipBtn = document.getElementById('flipBtn');
        const resetBtn = document.getElementById('resetBtn');
        const headsEl = document.getElementById('heads');
        const tailsEl = document.getElementById('tails');

        let heads = 0, tails = 0;
        let isFliping = false;

        function flipCoin() {
            if (isFliping) return;
            isFliping = true;
            flipBtn.disabled = true;

            coinEl.classList.remove('flip');
            void coinEl.offsetWidth; // trigger reflow
            coinEl.classList.add('flip');

            const result = Math.random() < 0.5 ? 'heads' : 'tails';
            setTimeout(() => {
                if (result === 'heads') {
                    coinEl.textContent = '🦅';
                    resultEl.textContent = 'Орёл!';
                    heads++;
                    headsEl.textContent = heads;
                } else {
                    coinEl.textContent = '🦅?'; // Решка — используем другой символ
                    coinEl.textContent = '🪙';
                    // Лучше использовать разные эмодзи для орла и решки
                    coinEl.textContent = '🪙'; // пока оставим
                    resultEl.textContent = 'Решка!';
                    tails++;
                    tailsEl.textContent = tails;
                }
                // Используем отдельные эмодзи для наглядности
                if (result === 'heads') {
                    coinEl.textContent = '🦅';
                } else {
                    coinEl.textContent = '🪙';
                }
                isFliping = false;
                flipBtn.disabled = false;
            }, 600);
        }

        resetBtn.addEventListener('click', () => {
            heads = 0;
            tails = 0;
            headsEl.textContent = '0';
            tailsEl.textContent = '0';
            coinEl.textContent = '🪙';
            resultEl.textContent = 'Счёт сброшен';
        });

        flipBtn.addEventListener('click', flipCoin);
    </script>
</body>
</html>
