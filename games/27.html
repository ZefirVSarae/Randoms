<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>КНБ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 20px 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 8px 8px 0 0 #111;
            text-align: center;
        }
        h2 { font-size: 28px; font-weight: 900; margin-bottom: 4px; }
        .info {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .info span {
            background: #f5f5f5;
            padding: 4px 14px;
            border-radius: 16px;
            border: 2px solid #ddd;
        }
        .vs-area {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px 0;
        }
        .choice-box {
            font-size: 64px;
            line-height: 1.2;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #111;
            border-radius: 24px;
            background: #f5f5f5;
            box-shadow: 4px 4px 0 0 #111;
        }
        .vs-text {
            font-size: 28px;
            font-weight: 900;
            color: #999;
        }
        .options {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .opt-btn {
            font-size: 48px;
            padding: 12px 20px;
            border: 3px solid #111;
            border-radius: 24px;
            background: white;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            touch-action: manipulation;
            min-width: 80px;
        }
        .opt-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        .opt-btn:disabled { opacity: 0.4; transform: none; box-shadow: 2px 2px 0 0 #ddd; cursor: not-allowed; }
        .status {
            font-weight: 700;
            font-size: 20px;
            min-height: 40px;
            margin: 8px 0;
        }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 10px 28px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 48px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        @media (max-width: 480px) {
            .game { padding: 16px 14px; }
            .choice-box { font-size: 48px; width: 80px; height: 80px; }
            .opt-btn { font-size: 36px; padding: 8px 14px; min-width: 60px; }
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>✊ Камень-ножницы-бумага</h2>
        <div class="info">
            <span>👤 <span id="playerScore">0</span></span>
            <span>🤖 <span id="aiScore">0</span></span>
        </div>
        <div class="vs-area">
            <div class="choice-box" id="playerChoice">🤔</div>
            <div class="vs-text">⚡</div>
            <div class="choice-box" id="aiChoice">🤖</div>
        </div>
        <div class="options">
            <button class="opt-btn" data-move="rock">🪨</button>
            <button class="opt-btn" data-move="paper">📄</button>
            <button class="opt-btn" data-move="scissors">✂️</button>
        </div>
        <div class="status" id="status">Выбери свой ход</div>
        <button class="reset-btn" id="resetBtn">🔄 Сбросить счёт</button>
    </div>
    <script>
        const playerScoreEl = document.getElementById('playerScore');
        const aiScoreEl = document.getElementById('aiScore');
        const playerChoiceEl = document.getElementById('playerChoice');
        const aiChoiceEl = document.getElementById('aiChoice');
        const statusEl = document.getElementById('status');
        const btns = document.querySelectorAll('.opt-btn');
        const resetBtn = document.getElementById('resetBtn');

        let playerScore = 0, aiScore = 0;
        let isWaiting = false;

        const emoji = { rock: '🪨', paper: '📄', scissors: '✂️' };
        const moves = ['rock', 'paper', 'scissors'];

        function getAIMove() {
            return moves[Math.floor(Math.random() * 3)];
        }

        function getWinner(player, ai) {
            if (player === ai) return 'draw';
            if (player === 'rock' && ai === 'scissors') return 'player';
            if (player === 'paper' && ai === 'rock') return 'player';
            if (player === 'scissors' && ai === 'paper') return 'player';
            return 'ai';
        }

        function play(playerMove) {
            if (isWaiting) return;
            isWaiting = true;
            const aiMove = getAIMove();
            const winner = getWinner(playerMove, aiMove);

            playerChoiceEl.textContent = emoji[playerMove];
            aiChoiceEl.textContent = emoji[aiMove];

            if (winner === 'player') {
                playerScore++;
                statusEl.textContent = '🎉 Ты выиграл!';
            } else if (winner === 'ai') {
                aiScore++;
                statusEl.textContent = '😵 Компьютер выиграл!';
            } else {
                statusEl.textContent = '🤝 Ничья!';
            }
            playerScoreEl.textContent = playerScore;
            aiScoreEl.textContent = aiScore;

            btns.forEach(b => b.disabled = true);
            setTimeout(() => {
                isWaiting = false;
                btns.forEach(b => b.disabled = false);
                statusEl.textContent = 'Выбери свой ход';
            }, 1200);
        }

        btns.forEach(btn => {
            btn.addEventListener('click', () => play(btn.dataset.move));
        });

        resetBtn.addEventListener('click', () => {
            playerScore = 0;
            aiScore = 0;
            playerScoreEl.textContent = '0';
            aiScoreEl.textContent = '0';
            playerChoiceEl.textContent = '🤔';
            aiChoiceEl.textContent = '🤖';
            statusEl.textContent = 'Счёт сброшен';
            setTimeout(() => statusEl.textContent = 'Выбери свой ход', 800);
        });
    </script>
</body>
</html>
