<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай число</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 24px 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
        }
        h2 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }
        .status {
            font-size: 20px;
            font-weight: 700;
            margin: 16px 0 12px;
            min-height: 40px;
        }
        .input-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        input {
            font-family: inherit;
            font-size: 24px;
            font-weight: 800;
            width: 100px;
            padding: 10px 12px;
            border: 3px solid #111;
            border-radius: 16px;
            text-align: center;
            outline: none;
            transition: 0.1s;
        }
        input:focus { background: #f0f0f0; }
        button {
            font-family: inherit;
            font-weight: 800;
            font-size: 20px;
            padding: 10px 24px;
            border: 3px solid #111;
            border-radius: 40px;
            background: #111;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 4px 4px 0 0 #555;
        }
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #555;
        }
        .reset-btn {
            background: white;
            color: #111;
            box-shadow: 4px 4px 0 0 #ccc;
            margin-top: 16px;
            font-size: 16px;
        }
        .reset-btn:active { box-shadow: 2px 2px 0 0 #ccc; }
        .hint {
            font-size: 16px;
            color: #666;
            margin-top: 8px;
        }
        .attempts {
            font-weight: 700;
            color: #333;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>🎯 Угадай число</h2>
        <div class="status" id="status">Введи число от 1 до 100</div>
        <div class="input-area">
            <input type="number" id="guessInput" min="1" max="100" placeholder="1–100">
            <button id="checkBtn">Проверить</button>
        </div>
        <div class="hint" id="hint"></div>
        <div class="attempts" id="attempts">Попыток: 0</div>
        <button class="reset-btn" id="resetBtn">🔄 Новая игра</button>
    </div>
    <script>
        let secret = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;
        const statusEl = document.getElementById('status');
        const hintEl = document.getElementById('hint');
        const attemptsEl = document.getElementById('attempts');
        const input = document.getElementById('guessInput');
        const checkBtn = document.getElementById('checkBtn');
        const resetBtn = document.getElementById('resetBtn');

        function checkGuess() {
            const val = parseInt(input.value);
            if (isNaN(val) || val < 1 || val > 100) {
                hintEl.textContent = '⚠️ Введите число от 1 до 100';
                return;
            }
            attempts++;
            attemptsEl.textContent = `Попыток: ${attempts}`;
            if (val === secret) {
                statusEl.textContent = '🎉 Угадал! Поздравляю!';
                hintEl.textContent = `Загадано было ${secret}`;
                statusEl.style.color = '#2b7a2b';
                checkBtn.disabled = true;
                input.disabled = true;
            } else if (val < secret) {
                hintEl.textContent = '📈 Больше';
                statusEl.textContent = 'Попробуй ещё';
                statusEl.style.color = '#111';
            } else {
                hintEl.textContent = '📉 Меньше';
                statusEl.textContent = 'Попробуй ещё';
                statusEl.style.color = '#111';
            }
            input.value = '';
            input.focus();
        }

        function resetGame() {
            secret = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            statusEl.textContent = 'Новая игра! Введи число';
            statusEl.style.color = '#111';
            hintEl.textContent = '';
            attemptsEl.textContent = 'Попыток: 0';
            checkBtn.disabled = false;
            input.disabled = false;
            input.value = '';
            input.focus();
        }

        checkBtn.addEventListener('click', checkGuess);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkGuess(); });
        resetBtn.addEventListener('click', resetGame);
        resetGame(); // инициализация
    </script>
</body>
</html>
