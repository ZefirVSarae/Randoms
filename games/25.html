<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Гонки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 16px 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
        }
        h2 { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
        .info {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 8px;
            padding: 0 4px;
        }
        .info span {
            background: #f5f5f5;
            padding: 4px 12px;
            border-radius: 12px;
            border: 2px solid #ddd;
        }
        canvas {
            border: 3px solid #111;
            border-radius: 16px;
            background: #2d2d2d;
            display: block;
            margin: 0 auto;
            width: 100%;
            aspect-ratio: 300/500;
            touch-action: none;
        }
        .status {
            font-weight: 700;
            min-height: 28px;
            margin: 8px 0 4px;
            font-size: 16px;
        }
        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 6px 0;
        }
        .ctrl-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 24px;
            padding: 8px 24px;
            border: 3px solid #111;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            box-shadow: 3px 3px 0 0 #ccc;
            transition: 0.1s;
            touch-action: manipulation;
            min-height: 50px;
            min-width: 80px;
        }
        .ctrl-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 0 #ccc;
        }
        .reset-btn {
            font-family: inherit;
            font-weight: 800;
            font-size: 16px;
            padding: 10px 28px;
            border: 3px solid #111;
            border-radius: 40px;
            background: white;
            color: #111;
            cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc;
            transition: 0.1s;
            margin-top: 4px;
            touch-action: manipulation;
            min-height: 48px;
        }
        .reset-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #ccc;
        }
        .hint {
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 4px;
        }
        @media (max-width: 480px) {
            .game { padding: 12px 14px; }
            .ctrl-btn { font-size: 20px; padding: 6px 16px; min-height: 44px; min-width: 60px; }
        }
    </style>
</head>
<body>
    <div class="game">
        <h2>🏎️ Гонки</h2>
        <div class="info">
            <span>🏆 <span id="score">0</span></span>
            <span>💥 <span id="crashes">0</span></span>
        </div>
        <canvas id="canvas" width="300" height="500"></canvas>
        <div class="status" id="status">Уворачивайся от машин!</div>
        <div class="hint">👆 Наклоняй телефон или используй кнопки</div>
        <div class="controls">
            <button class="ctrl-btn" id="leftBtn">◀</button>
            <button class="ctrl-btn" id="rightBtn">▶</button>
        </div>
        <button class="reset-btn" id="resetBtn">🔄 Новая гонка</button>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const crashesEl = document.getElementById('crashes');
        const statusEl = document.getElementById('status');

        const W = 300, H = 500;
        const CAR_W = 30, CAR_H = 50;
        let player = { x: 135, y: 430 };
        let enemies = [];
        let score = 0;
        let crashes = 0;
        let gameActive = true;
        let gameLoop = null;
        let speed = 3;
        let moveLeft = false, moveRight = false;

        const colors = ['#ef4444', '#3b82f6', '#eab308', '#8b5cf6', '#ec4899', '#f97316'];

        function initGame() {
            player.x = 135;
            enemies = [];
            score = 0;
            crashes = 0;
            gameActive = true;
            speed = 3;
            scoreEl.textContent = '0';
            crashesEl.textContent = '0';
            statusEl.textContent = 'Уворачивайся от машин!';
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 30);
        }

        function spawnEnemy() {
            const x = Math.random() * (W - CAR_W);
            const color = colors[Math.floor(Math.random() * colors.length)];
            enemies.push({
                x, y: -CAR_H,
                w: CAR_W, h: CAR_H,
                color: color,
                speed: speed + Math.random() * 1.5
            });
        }

        function update() {
            if (!gameActive) return;

            // спавн
            if (Math.random() < 0.04 + speed * 0.005) {
                spawnEnemy();
            }

            // движение врагов
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.speed;
                if (e.y > H) {
                    enemies.splice(i, 1);
                    score++;
                    scoreEl.textContent = score;
                    // увеличиваем скорость
                    speed = 3 + Math.floor(score / 5) * 0.5;
                }
            }

            // движение игрока
            if (moveLeft && player.x > 0) player.x -= 5;
            if (moveRight && player.x + CAR_W < W) player.x += 5;

            // столкновения
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (player.x < e.x + e.w &&
                    player.x + CAR_W > e.x &&
                    player.y < e.y + e.h &&
                    player.y + CAR_H > e.y) {
                    // столкновение
                    crashes++;
                    crashesEl.textContent = crashes;
                    enemies.splice(i, 1);
                    if (crashes >= 5) {
                        gameActive = false;
                        statusEl.textContent = '💥 Авария! Игра окончена.';
                        if (gameLoop) clearInterval(gameLoop);
                    }
                }
            }

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            
            // дорога
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, W, H);
            // разметка
            ctx.fillStyle = '#666';
            for (let y = 0; y < H; y += 40) {
                ctx.fillRect(W/2 - 3, y, 6, 20);
            }
            // обочины
            ctx.fillStyle = '#555';
            ctx.fillRect(0, 0, 8, H);
            ctx.fillRect(W - 8, 0, 8, H);

            // враги
            for (let e of enemies) {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.w, e.h);
                ctx.fillStyle = '#111';
                ctx.fillRect(e.x + 4, e.y + 4, 8, 6);
                ctx.fillRect(e.x + e.w - 12, e.y + 4, 8, 6);
                ctx.fillRect(e.x + 4, e.y + e.h - 10, 8, 6);
                ctx.fillRect(e.x + e.w - 12, e.y + e.h - 10, 8, 6);
            }

            // игрок
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(player.x, player.y, CAR_W, CAR_H);
            ctx.fillStyle = '#86efac';
            ctx.fillRect(player.x + 4, player.y + 4, 8, 6);
            ctx.fillRect(player.x + CAR_W - 12, player.y + 4, 8, 6);
            ctx.fillRect(player.x + 4, player.y + CAR_H - 10, 8, 6);
            ctx.fillRect(player.x + CAR_W - 12, player.y + CAR_H - 10, 8, 6);
            // фары
            ctx.fillStyle = '#facc15';
            ctx.fillRect(player.x + 4, player.y - 2, 6, 4);
            ctx.fillRect(player.x + CAR_W - 10, player.y - 2, 6, 4);
        }

        // Управление
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
        document.getElementById('leftBtn').addEventListener('touchend', (e) => { e.preventDefault(); moveLeft = false; });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
        document.getElementById('rightBtn').addEventListener('touchend', (e) => { e.preventDefault(); moveRight = false; });

        // Клавиатура
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); moveLeft = true; }
            if (e.key === 'ArrowRight') { e.preventDefault(); moveRight = true; }
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); moveLeft = false; }
            if (e.key === 'ArrowRight') { e.preventDefault(); moveRight = false; }
        });

        // Акселерометр
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                const gamma = e.gamma || 0;
                if (Math.abs(gamma) > 10) {
                    if (gamma > 0) moveRight = true;
                    else moveLeft = true;
                } else {
                    moveLeft = false;
                    moveRight = false;
                }
            }, { passive: true });
        }

        resetBtn.addEventListener('click', initGame);
        initGame();
    </script>
</body>
</html>
