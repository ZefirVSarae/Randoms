<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Морской бой</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .game {
            background: white;
            border: 3px solid #111;
            border-radius: 32px;
            padding: 18px 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 6px 6px 0 0 #111;
            text-align: center;
        }
        h2 { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
        .info { display: flex; justify-content: space-between; font-weight: 800; font-size: 16px; margin-bottom: 8px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin: 8px auto;
            max-width: 300px;
        }
        .cell {
            aspect-ratio: 1/1;
            border: 2px solid #111;
            border-radius: 6px;
            background: #d1d5db;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
        }
        .cell:active { transform: scale(0.92); }
        .cell.hit { background: #ef4444; color: white; }
        .cell.miss { background: #9ca3af; color: #4b5563; }
        .cell.ship { background: #22c55e; } /* только для отладки, но не показываем */
        .status { font-weight: 700; min-height: 28px; margin: 6px 0; }
        .reset-btn {
            font-family: inherit; font-weight: 800; font-size: 16px;
            padding: 8px 24px; border: 3px solid #111; border-radius: 40px;
            background: white; color: #111; cursor: pointer;
            box-shadow: 4px 4px 0 0 #ccc; transition: 0.1s;
            margin-top: 4px;
        }
        .reset-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 0 #ccc; }
    </style>
</head>
<body>
    <div class="game">
        <h2>⚓ Морской бой</h2>
        <div class="info">
            <span>💥 <span id="shots">0</span>/15</span>
            <span>🚢 <span id="ships">0</span>/4</span>
        </div>
        <div class="grid" id="grid"></div>
        <div class="status" id="status">Кликни по клетке</div>
        <button class="reset-btn" id="resetBtn">🔄 Новая игра</button>
    </div>
    <script>
        const size = 6;
        let board = []; // 0 - пусто, 1 - корабль, 2 - подбит, 3 - мимо
        let ships = []; // массив объектов {cells: [{x,y}], hits: number}
        let totalShips = 4;
        let shipsSunk = 0;
        let shots = 0;
        const maxShots = 15;
        let gameOver = false;

        const gridEl = document.getElementById('grid');
        const shotsEl = document.getElementById('shots');
        const shipsEl = document.getElementById('ships');
        const statusEl = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');

        function initBoard() {
            board = Array(size).fill().map(() => Array(size).fill(0));
            ships = [];
            shipsSunk = 0;
            shots = 0;
            gameOver = false;
            // расстановка кораблей
            const shipLengths = [2,2,3,3];
            for (let len of shipLengths) {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 100) {
                    attempts++;
                    const horiz = Math.random() < 0.5;
                    let x, y;
                    if (horiz) {
                        x = Math.floor(Math.random() * (size - len + 1));
                        y = Math.floor(Math.random() * size);
                    } else {
                        x = Math.floor(Math.random() * size);
                        y = Math.floor(Math.random() * (size - len + 1));
                    }
                    // проверка на занятость
                    let free = true;
                    const cells = [];
                    for (let i = 0; i < len; i++) {
                        const cx = horiz ? x + i : x;
                        const cy = horiz ? y : y + i;
                        if (board[cy][cx] !== 0) { free = false; break; }
                        cells.push({x: cx, y: cy});
                    }
                    if (free) {
                        for (let cell of cells) {
                            board[cell.y][cell.x] = 1;
                        }
                        ships.push({cells, hits: 0});
                        placed = true;
                    }
                }
                if (!placed) {
                    // fallback – просто вставляем вручную
                    // но для простоты пропустим, вероятность мала
                }
            }
            render();
            updateStats();
        }

        function render() {
            gridEl.innerHTML = '';
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const val = board[y][x];
                    if (val === 2) { cell.classList.add('hit'); cell.textContent = '✕'; }
                    else if (val === 3) { cell.classList.add('miss'); cell.textContent = '·'; }
                    else if (val === 1) { /* не показываем корабли */ }
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    cell.addEventListener('click', () => handleClick(x, y));
                    gridEl.appendChild(cell);
                }
            }
        }

        function updateStats() {
            shotsEl.textContent = shots;
            shipsEl.textContent = shipsSunk;
        }

        function handleClick(x, y) {
            if (gameOver) return;
            if (shots >= maxShots) return;
            const val = board[y][x];
            if (val === 2 || val === 3) return; // уже стреляли

            shots++;
            if (val === 1) { // попадание
                board[y][x] = 2;
                // проверить, какой корабль
                for (let ship of ships) {
                    const idx = ship.cells.findIndex(c => c.x === x && c.y === y);
                    if (idx !== -1) {
                        ship.hits++;
                        if (ship.hits === ship.cells.length) {
                            shipsSunk++;
                        }
                        break;
                    }
                }
                statusEl.textContent = '💥 Попадание!';
                // проверка, все ли потоплены
                if (shipsSunk === ships.length) {
                    statusEl.textContent = '🎉 Победа! Все корабли потоплены!';
                    gameOver = true;
                }
            } else {
                board[y][x] = 3;
                statusEl.textContent = '🌊 Мимо';
            }
            render();
            updateStats();

            if (shots >= maxShots && shipsSunk < ships.length) {
                statusEl.textContent = '😵 Поражение. Выстрелы кончились.';
                gameOver = true;
            }
        }

        resetBtn.addEventListener('click', () => {
            initBoard();
            statusEl.textContent = 'Новая игра!';
        });

        initBoard();
    </script>
</body>
</html>
