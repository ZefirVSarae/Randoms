<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randoms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,800;0,900;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Отключаем Jekyll */
        /* stylelint-disable */
        body, button, input, select, textarea {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .game-count {
            animation: pulse-glow 3s ease-in-out infinite;
        }
        #app-container iframe {
            transition: opacity 0.3s ease;
        }
        #app-container iframe.loading {
            opacity: 0;
        }
        #app-container iframe.loaded {
            opacity: 1;
        }
        /* Стиль для сообщения об ошибке */
        .error-message {
            background: #fef2f2;
            border: 2px solid #ef4444;
            border-radius: 16px;
            padding: 20px;
            color: #991b1b;
        }
        /* Стиль для лоадера */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #111;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Отключаем все Jekyll-обработки */
        .jekyll-ignore {
            display: none;
        }
    </style>
</head>
<body class="bg-white text-neutral-900 min-h-screen flex flex-col justify-between items-center p-4 sm:p-8 selection:bg-neutral-200">

    <main class="grow flex flex-col items-center justify-center max-w-4xl w-full my-auto">
        <div class="text-center mb-6">
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-wider text-neutral-900 uppercase">RANDOMS</h1>
            <p class="text-xs font-bold text-neutral-400 mt-1">рандомный прикол каждые 30-60 минут</p>
        </div>

        <div id="app-container" class="w-full bg-white rounded-3xl border-2 border-neutral-900 p-6 sm:p-10 shadow-[6px_6px_0px_0px_rgba(17,17,17,1)]">
            <!-- Сюда будет загружаться iframe с игрой -->
            <div class="flex flex-col items-center justify-center h-[500px]">
                <div class="loader"></div>
                <p class="text-neutral-400 font-bold mt-4">Загрузка игр...</p>
            </div>
        </div>

        <div class="mt-8 text-center space-y-1">
            <div id="timer" class="text-4xl sm:text-6xl font-black tracking-normal text-neutral-900">00:00:00</div>
            <div class="text-[10px] font-bold text-neutral-400 uppercase tracking-widest">до следующего хаоса</div>
        </div>
    </main>

    <footer class="w-full max-w-4xl mt-8 pt-4 border-t border-neutral-200 flex flex-col sm:flex-row justify-between items-center text-xs text-neutral-400 font-bold gap-2">
        <div class="game-count" id="gameCounter">🎮 Игр: <span id="gameCount">...</span></div>
        <div>v2.1 · автоматическое определение</div>
    </footer>

    <script>
        // === КОНФИГУРАЦИЯ ===
        // GitHub Pages URL (используем сырые ссылки)
        const GITHUB_USERNAME = 'ZefirVSarae';
        const GITHUB_REPO = 'Randoms';
        const GAMES_FOLDER = 'games';
        
        // === ОСНОВНАЯ ЛОГИКА ===
        let TOTAL_TEMPLATES = 0;
        let gameList = [];
        let currentActiveSlot = -1;

        // Функция для получения списка игр
        async function fetchGameList() {
            try {
                // Пробуем через GitHub API
                const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${GAMES_FOLDER}`;
                const response = await fetch(apiUrl, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) {
                    // Если API не работает, пробуем через raw.githubusercontent.com
                    return await fetchGameListFallback();
                }
                
                const files = await response.json();
                
                if (!Array.isArray(files)) {
                    throw new Error('Неверный ответ от API');
                }
                
                // Фильтруем только .html файлы и сортируем по номеру
                const htmlFiles = files
                    .filter(file => file.name && file.name.endsWith('.html'))
                    .map(file => {
                        const num = parseInt(file.name.replace('.html', ''));
                        return { 
                            number: isNaN(num) ? 0 : num, 
                            name: file.name 
                        };
                    })
                    .filter(f => f.number > 0)
                    .sort((a, b) => a.number - b.number);
                
                if (htmlFiles.length === 0) {
                    throw new Error('HTML файлы не найдены');
                }
                
                gameList = htmlFiles;
                TOTAL_TEMPLATES = htmlFiles.length;
                updateGameCounter();
                
                console.log(`✅ Загружено ${TOTAL_TEMPLATES} игр через API`);
                return htmlFiles;
                
            } catch (error) {
                console.warn('⚠️ API ошибка, пробуем fallback:', error.message);
                return await fetchGameListFallback();
            }
        }

        // Fallback метод - пытаемся загрузить список через index
        async function fetchGameListFallback() {
            try {
                // Пробуем загрузить список через прямой запрос к папке (не всегда работает)
                const baseUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/${GAMES_FOLDER}/`;
                
                // Пробуем проверить наличие игр от 1 до 50
                const foundGames = [];
                for (let i = 1; i <= 50; i++) {
                    try {
                        const response = await fetch(`${baseUrl}${i}.html`, { 
                            method: 'HEAD',
                            cache: 'no-cache'
                        });
                        if (response.ok) {
                            foundGames.push({ number: i, name: `${i}.html` });
                        }
                    } catch (e) {
                        // Игнорируем ошибки отдельных файлов
                    }
                }
                
                if (foundGames.length > 0) {
                    gameList = foundGames;
                    TOTAL_TEMPLATES = foundGames.length;
                    updateGameCounter();
                    console.log(`✅ Загружено ${TOTAL_TEMPLATES} игр через fallback`);
                    return foundGames;
                }
                
                // Если ничего не найдено - используем локальный список
                return useLocalGameList();
                
            } catch (error) {
                console.warn('⚠️ Fallback не сработал:', error.message);
                return useLocalGameList();
            }
        }

        // Локальный список игр (на случай, если ничего не работает)
        function useLocalGameList() {
            // Предполагаем, что у нас есть игры с 1 по 25
            const localGames = [];
            for (let i = 1; i <= 25; i++) {
                localGames.push({ number: i, name: `${i}.html` });
            }
            gameList = localGames;
            TOTAL_TEMPLATES = 25;
            updateGameCounter();
            console.log(`📁 Используем локальный список: ${TOTAL_TEMPLATES} игр`);
            return gameList;
        }

        // Обновление счётчика в футере
        function updateGameCounter() {
            const counter = document.getElementById('gameCount');
            if (counter) {
                counter.textContent = TOTAL_TEMPLATES > 0 ? TOTAL_TEMPLATES : '?';
            }
        }

        // === ОСНОВНАЯ ЛОГИКА ПОРТАЛА ===
        function getDeterministicSlot(nowSec) {
            let slotIndex = 0;
            let currentSec = 0;
            let maxAttempts = 1000;
            
            while (maxAttempts > 0) {
                maxAttempts--;
                let h = (slotIndex * 12582917 + 72139) % 1000000;
                let duration = 1800 + (Math.abs(h) % 1801);
                
                if (currentSec + duration > nowSec) {
                    return {
                        slotIndex: slotIndex,
                        startTime: currentSec,
                        duration: duration,
                        endTime: currentSec + duration
                    };
                }
                currentSec += duration;
                slotIndex++;
            }
            
            return {
                slotIndex: 0,
                startTime: nowSec,
                duration: 1800,
                endTime: nowSec + 1800
            };
        }

        function calculateTemplateIndex(slot) {
            if (TOTAL_TEMPLATES === 0) return 0;
            
            let seed = (slot.slotIndex * 1664525 + 1013904223) % 4294967296;
            let lastTwoDigits = Math.abs(seed) % 100;
            let subSeed = (slot.slotIndex * 22695477 + 1) % 4294967296;
            let subtractValue = 15 + (Math.abs(subSeed) % 16);
            let rawVal = lastTwoDigits - subtractValue;
            let finalIdx = Math.abs(rawVal) % TOTAL_TEMPLATES;
            return finalIdx;
        }

        function updatePortal() {
            const nowSec = Math.floor(Date.now() / 1000);
            const slot = getDeterministicSlot(nowSec);
            const remaining = slot.endTime - nowSec;

            const h = Math.floor(remaining / 3600);
            const m = Math.floor((remaining % 3600) / 60);
            const s = remaining % 60;
            document.getElementById('timer').innerText = 
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;

            if (currentActiveSlot !== slot.slotIndex) {
                currentActiveSlot = slot.slotIndex;
                
                if (TOTAL_TEMPLATES === 0) {
                    const container = document.getElementById('app-container');
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-[500px] text-neutral-400">
                            <span class="text-6xl mb-4">🎮</span>
                            <p class="font-bold text-lg">Нет доступных игр</p>
                            <p class="text-sm">Добавьте игры в папку /games</p>
                            <button onclick="location.reload()" 
                                    class="mt-4 px-6 py-2 bg-neutral-900 text-white rounded-full font-bold hover:bg-neutral-700 transition">
                                Обновить
                            </button>
                        </div>
                    `;
                    return;
                }
                
                const gameIdx = calculateTemplateIndex(slot);
                const safeIdx = Math.min(gameIdx, TOTAL_TEMPLATES - 1);
                const gameNumber = gameList[safeIdx]?.number || (safeIdx + 1);
                
                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <iframe src="${GAMES_FOLDER}/${gameNumber}.html" 
                            class="w-full h-[500px] border-0 rounded-2xl"
                            scrolling="auto"
                            title="Игра ${gameNumber}"
                            loading="lazy">
                    </iframe>
                `;
            }
        }

        // === ИНИЦИАЛИЗАЦИЯ ===
        async function init() {
            // Показываем лоадер
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-[500px]">
                    <div class="loader"></div>
                    <p class="text-neutral-400 font-bold mt-4">Загрузка игр...</p>
                </div>
            `;
            
            // Загружаем список игр
            await fetchGameList();
            
            // Обновляем портал
            updatePortal();
            
            // Запускаем таймер
            setInterval(updatePortal, 1000);
        }

        // Запускаем инициализацию
        init();

        // Обновляем счётчик при фокусе
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                fetchGameList();
            }
        });

        // Обновляем список каждые 5 минут
        setInterval(fetchGameList, 300000);

        console.log('🎮 Randoms Portal v2.1');
        console.log(`📁 Репозиторий: ${GITHUB_USERNAME}/${GITHUB_REPO}`);
    </script>
</body>
</html>
